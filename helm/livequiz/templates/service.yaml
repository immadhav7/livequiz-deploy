apiVersion: v1
kind: Service
metadata:
  name: {{ include "livequiz.fullname" . }}
  labels:
    {{- include "livequiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "livequiz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
